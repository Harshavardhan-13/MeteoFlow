services:
  postgres:
    image: postgres:17-alpine
    container_name: weather-etl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather_etl}
      POSTGRES_USER: ${POSTGRES_USER:-weather_etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather_etl_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - weather_etl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weather_etl_postgres_data:
